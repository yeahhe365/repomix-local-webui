server {
  listen 80;
  server_name _;

  # Docker embedded DNS. Re-resolve so a polluted startup cache
  # (e.g. Clash Fake-IP 198.18.0.0/16) cannot stick forever.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  root /usr/share/nginx/html;
  index index.html;

  # Compose service name (avoid short name "server" — Clash Fake-IP bait)
  set $api_upstream repomix-api:8787;

  location /api/ {
    # Variable forces runtime DNS via resolver above (not resolve-once-at-start).
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pack can be large/slow; avoid premature upstream cutoffs
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location = /health {
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
