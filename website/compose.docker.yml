# Run the packaged website and API using production-style Docker images
# $ docker compose -f website/compose.docker.yml up --build
#
# Service is named repomix-api (not "server") so host Clash Fake-IP DNS
# cannot hijack the short name into 198.18.0.0/16.

name: repomix-local-webui

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: prebuilt
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - repomix-api

  repomix-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - ENABLE_LOCAL_PATH_MODE=true
      - LOCAL_PATH_ALLOWLIST=/Users,/Volumes/WD_BLACK,/Volumes/emby
    volumes:
      - /Users:/Users:ro
      - /Volumes/WD_BLACK:/Volumes/WD_BLACK:ro
      - /Volumes/emby:/Volumes/emby:ro
